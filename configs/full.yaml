# Everything, including VAE-based adaptive tightening.
#
# Falls back to ratelimit_queue behaviour when models/vae.npz is absent or
# was trained on a different feature layout. The anomaly layer modifies the
# static limits; it never replaces them.
mode: full

upstream:
  base_url: http://127.0.0.1:8000

rate_limit:
  requests_per_sec: 5.0
  requests_burst: 10.0
  tokens_per_sec: 2000.0
  tokens_burst: 8000.0
  client_max_inflight: 4
  max_tokens_ceiling: 1024

backpressure:
  # At or near the backend's --max-num-seqs; see configs/ratelimit_queue.yaml.
  global_max_inflight: 32
  upstream_max_num_seqs: 32
  queue_wait_ms: 200
  reserved_cheap_slots: 8
  cheap_cost_threshold: 512

fairshare:
  share_multiplier: 1.25

anomaly:
  model_path: models/vae.npz
  # Reconstruction error in baseline standard deviations. Set these from the
  # holdout percentiles that gateway.anomaly.train prints; below the baseline
  # p99 you are throttling normal users.
  suspect_threshold: 3.0
  hostile_threshold: 6.0
  suspect_rate_multiplier: 0.5
  hostile_rate_multiplier: 0.15
  tier_decay_s: 30.0

logging:
  run_id: mitigated-vae
  log_features: true
