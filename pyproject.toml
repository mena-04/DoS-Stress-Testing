[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dos-mitigation-gateway"
version = "0.1.0"
description = "Per-client rate limiting and queue-pressure shedding in front of a vLLM inference server"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "prometheus-client>=0.20",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Exact prompt token counts. Tokenizer only, no model weights, no GPU.
tokenizer = ["transformers>=4.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
# Figures for the submission report. Not needed to run the gateway.
report = ["matplotlib>=3.7"]

[project.scripts]
mitigation-gateway = "gateway.__main__:main"
fake-vllm = "gateway.fake_vllm:main"

[tool.setuptools.packages.find]
include = ["gateway*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
